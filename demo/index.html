<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cavalier-contours-js — interactive demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a1420'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%2359d8ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%23ffb454' stroke-width='2'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header id="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" width="34" height="34">
              <path d="M20 4 A16 16 0 1 0 36 20" fill="none" stroke="var(--c-src)" stroke-width="2.5" />
              <path d="M20 11 A9 9 0 1 0 29 20" fill="none" stroke="var(--c-offset)" stroke-width="2.5" />
              <circle cx="20" cy="20" r="2.2" fill="var(--c-rev)" />
            </svg>
          </div>
          <div class="brand-text">
            <h1>cavalier<span>//</span>contours</h1>
            <p>2-D polyline offset &amp; boolean &mdash; pure TS port</p>
          </div>
        </header>
        <nav id="scene-tabs" aria-label="Scenes"></nav>
        <div id="scene-blurb"></div>
        <section id="controls"></section>
        <section id="stats-panel">
          <h2><span class="rule"></span>measurements<span class="rule"></span></h2>
          <dl id="stats"></dl>
        </section>
        <footer id="sidebar-footer">
          <div class="hint-row"><kbd>drag</kbd> vertex / geometry &nbsp;·&nbsp; <kbd>drag</kbd> empty = pan</div>
          <div class="hint-row"><kbd>scroll</kbd> zoom &nbsp;·&nbsp; <kbd>F</kbd> fit view</div>
        </footer>
      </aside>
      <main id="viewport">
        <canvas id="canvas"></canvas>
        <div id="warning-badge" hidden>
          <span class="warn-glyph">&#9650;</span>
          <span id="warning-text"></span>
        </div>
        <div id="hud">
          <span id="hud-coords">x&nbsp;+0.000&nbsp;&nbsp;y&nbsp;+0.000</span>
          <span class="hud-sep"></span>
          <span id="hud-zoom">100%</span>
          <button id="fit-btn" title="Fit view to geometry (F)">&#8853; fit</button>
        </div>
        <div id="titleblock">
          <div class="tb-row tb-head">
            <span id="tb-scene">POLYLINE OFFSET</span>
          </div>
          <div class="tb-row">
            <span class="tb-label">lib</span><span class="tb-val">cavalier-contours-js 0.1.0</span>
          </div>
          <div class="tb-row">
            <span class="tb-label">sheet</span><span class="tb-val" id="tb-sheet">01 / 04</span>
            <span class="tb-label">proj</span><span class="tb-val">CAV-CTR</span>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
